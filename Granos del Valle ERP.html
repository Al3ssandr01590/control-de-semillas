@media(prefers-reduced-motion:reduce){*{transition:none!important}}

 <div class="card"><h3>Alertas de stock</h3><div class="sub">${al.length} alertas</div>${al.map(a=>`<div class="row" style="justify-content:space-between;margin-top:8px"><span>${a.p.name} <span class="mut">· ${brs(a.b)}</span></span><span class="pill bad">${N(a.stock)}</span></div>`).join('')||'<p class="mut">Sin alertas</p>'}</div></div>`}

 return head('Análisis Empresarial','Centro de inteligencia de negocios')+`<div class="card row" style="gap:24px"><div style="width:110px;height:110px;border-radius:50%;border:9px solid var(--${lvl[1]==='ok'?'pri':lvl[1]==='warn'?'gold':'red'});display:grid;place-items:center;text-align:center"><div><b style="font:700 32px var(--serif)">${sc}</b><div class="mut" style="font-size:10px">/100 pts</div></div></div><div style="flex:1;min-width:220px"><h3>Índice de salud: ${lvl[0]}</h3><p class="mut">Combina margen, inventario bajo el mínimo y cartera vencida.</p></div></div>

 const blocks=scope().map(b=>{const es=S.emps.filter(e=>e.br===b&&e.status==='Activo'),cal=es.map(e=>({e,p:pay(e,f)})),tn=sum(cal,c=>c.p.neto);
  const done=S.runs.find(r=>r.br===b&&r.period===per&&r.freq===(S.freq||'Mensual'));
  return `<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><div><h3>${brn(b)}</h3><div class="sub">${per}</div></div>${done?'<span class="pill ok">Pagada</span>':`<button class="btn pri" data-a="payRun" data-br="${b}">Pagar nómina · ${Q(tn)}</button>`}</div>
  <div class="tw"><table><thead><tr><th>Empleado</th><th class="r">Sueldo</th><th class="r">Horas extra</th><th class="r">Bono</th><th class="r">Bonif. incentivo</th><th class="r">IGSS 4.83%</th><th class="r">Anticipo</th><th class="r">Líquido</th></tr></thead><tbody>${cal.map(c=>`<tr><td><b>${c.e.name}</b><div class="mut" style="font-size:11px">${c.e.role}</div></td><td class="r">${Q(c.p.base)}</td><td class="r"><span class="mini"><input type="number" min="0" data-c="pin" data-id="${c.e.id}" data-k="h" value="${c.p.i.h||0}" ${done?'disabled':''}> h</span><div class="mut" style="font-size:11px">${Q(c.p.extra)}</div></td><td class="r"><span class="mini"><input type="number" min="0" data-c="pin" data-id="${c.e.id}" data-k="b" value="${c.p.i.b||0}" ${done?'disabled':''}></span></td><td class="r">${Q(c.p.bon)}</td><td class="r bad">-${Q(c.p.igss)}</td><td class="r"><span class="mini"><input type="number" min="0" data-c="pin" data-id="${c.e.id}" data-k="a" value="${c.p.i.a||0}" ${done?'disabled':''}></span></td><td class="r b">${Q(c.p.neto)}</td></tr>`).join('')}<tr><td colspan="7" class="b">Total líquido a pagar</td><td class="r b" style="font-size:16px">${Q(tn)}</td></tr></tbody></table></div><div class="mut" style="font-size:12px;margin-top:6px">Cuota patronal IGSS (12.67%): ${Q(sum(cal,c=>c.p.pat))} · Costo total de la empresa: ${Q(tn+sum(cal,c=>c.p.pat+c.p.igss))}</div></div>`}).join('');
 return head('Nómina','Cálculo de sueldos por sucursal con IGSS, horas extra y bonificación',brSel()+`<div class="tabs">${['Mensual','Quincenal'].map(x=>`<button class="${(S.freq||'Mensual')===x?'on':''}" data-a="freq" data-v="${x}">${x}</button>`).join('')}</div>`)+blocks+
 `<div class="card"><h3>Historial de nóminas</h3><div class="tw"><table><thead><tr><th>Período</th><th>Frecuencia</th><th>Sucursal</th><th>Fecha de pago</th><th class="r">Total líquido</th><th>Estado</th></tr></thead><tbody>${S.runs.slice().reverse().map(r=>`<tr><td>${r.period}</td><td>${r.freq}</td><td>${brn(r.br)}</td><td>${fd(r.date)}</td><td class="r b">${Q(r.total)}</td><td><span class="pill ok">${r.status}</span></td></tr>`).join('')}</tbody></table></div></div>`}
const VIEWS={dashboard:vDashboard,caja:vCaja,ventas:vVentas,compras:vCompras,prods:vProds,cats:vCats,transfer:vTransfer,kardex:vKardex,clientes:vClientes,provs:vProvs,personal:vPersonal,nomina:vNomina,movs:vMovs,cxc:vCxc,cxp:vCxp,rventas:vRventas,rinv:vRinv,analisis:vAnalisis,sucursales:vSuc};
function render(){$('#side').innerHTML=sidebar();$('#side').classList.toggle('open',!!S.nav);$('#main').innerHTML=(VIEWS[S.route]||vDashboard)();}
</script>
<script>
const num=v=>Math.round((parseFloat(v)||0)*100)/100;
function setPath(o,k,v){const ks=k.split('.');if(ks.length===1){o[k]=v;return}o.b[ks[0]][ks[1]]=v}
const A={
go(d){S.route=d.r;S.nav=false;location.hash=d.r;render();scrollTo(0,0)},menu(){S.nav=!S.nav;render()},
theme(){const r=document.documentElement;const dark=getComputedStyle(r).colorScheme==='dark'||r.dataset.theme==='dark';r.dataset.theme=dark?'light':'dark'},
reset(){seed();closeM();render();toast('Datos de la demo restablecidos')},mclose:closeM,
mbg(d,el,ev){if(ev.target===el)closeM()},
openCash(){const br=S.br==='all'?'s1':S.br;if(S.cash.find(c=>c.br===br&&c.state==='Abierta'))return toast('Ya hay una caja abierta en '+brs(br));S.cash.push({id:S.cash.length+1,date:TODAY,br,user:'Sofía Morales',open:300,state:'Abierta'});render();toast('Caja abierta en '+brs(br))},
closeCash(d){S.cash.find(c=>c.id==d.id).state='Cerrada';render()},
newSale(){S.m={kind:'sale',br:S.br==='all'?'s1':S.br,cl:CLI[0],type:'Contado',items:[{pid:1,qty:1}]};modal(saleModal())},
smadd(){S.m.items.push({pid:2,qty:1});modal(saleModal())},smdel(d){S.m.items.splice(d.i,1);modal(saleModal())},
smsave(){const m=S.m;if(!m.items.length)return toast('Agrega al menos un producto');for(const it of m.items){const p=prod(it.pid);if(p.b[m.br].stock<it.qty)return toast('Stock insuficiente de '+p.name+' en '+brs(m.br))}
 const items=m.items.map(i=>({pid:+i.pid,qty:+i.qty,price:prod(i.pid).b[m.br].price,cost:prod(i.pid).b[m.br].cost}));const total=sum(items,i=>i.qty*i.price);const id=++S.seq.sale;
 items.forEach(i=>kmove(m.br,i.pid,'Salida venta',-i.qty,'Venta #'+id));S.sales.push({id,date:TODAY,br:m.br,cl:m.cl,type:m.type,paid:m.type==='Contado'?total:0,items,total,due:m.type==='Crédito'?'2026-12-30':''});closeM();render();toast('Venta #'+id+' registrada: '+Q(total))},
newProd(){S.m={kind:'prod',isNew:true,p:{name:'',cat:CATS[0],unit:'Quintal',min:5,b:{s1:{cost:0,price:0,stock:0},s2:{cost:0,price:0,stock:0}}}};modal(prodModal())},
editProd(d){S.m={kind:'prod',p:JSON.parse(JSON.stringify(prod(d.id))),id:+d.id};modal(prodModal())},
saveProd(){const m=S.m,d=m.p;if(!d.name.trim())return toast('Escribe el nombre del producto');let p;
 if(m.isNew){p={id:S.seq.pid++,code:'GRA-'+String(S.seq.pid-1).padStart(4,'0'),sup:1,b:{s1:{...d.b.s1,stock:0},s2:{...d.b.s2,stock:0}}};S.prods.push(p)}else p=prod(m.id);
 Object.assign(p,{name:d.name,cat:d.cat,unit:d.unit,min:+d.min});
 BR.forEach(b=>{const x=p.b[b.id],n=d.b[b.id];x.price=+n.price;x.cost=+n.cost;const diff=num(n.stock-x.stock);if(diff)kmove(b.id,p.id,m.isNew?'Saldo inicial':'Ajuste manual',diff,m.isNew?'Alta de producto':'Ajuste desde Inventario')});
 closeM();render();toast('Producto guardado: precios y stock actualizados por sucursal')},
newCat(){modal('<h2>Nueva categoría</h2><label class="f">Nombre<input id="catin"></label><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-a="mclose">Cancelar</button><button class="btn pri" data-a="saveCat">Guardar</button></div>')},
saveCat(){const v=$('#catin').value.trim();if(v&&!CATS.includes(v))CATS.push(v);closeM();render()},
tradd(){const d=S.tr,pid=+$('#trsel').value;if(!d.items.find(i=>i.pid===pid))d.items.push({pid,qty:1});render()},trdel(d){S.tr.items.splice(d.i,1);render()},
trgo(){const t=S.tr;if(!t.items.length)return toast('Agrega productos a transferir');for(const i of t.items)if(prod(i.pid).b[t.from].stock<i.qty)return toast('Stock insuficiente de '+prod(i.pid).name);
 t.items.forEach(i=>{kmove(t.from,i.pid,'Transferencia salida',-i.qty,'Hacia '+brs(t.to)+(t.note?' · '+t.note:''));kmove(t.to,i.pid,'Transferencia entrada',+i.qty,'Desde '+brs(t.from)+(t.note?' · '+t.note:''))});S.tr=null;render();toast('Transferencia realizada')},
newBuy(){S.m=newBuyDraft(S.br==='all'?'s1':S.br);modal(buyModal())},buyFromSug(d){buyFromSug(d.br)},
biadd(){S.m.items.push({pid:1,qty:1,cost:prod(1).b[S.m.br].cost});modal(buyModal())},bidel(d){S.m.items.splice(d.i,1);modal(buyModal())},
buySave(){const d=S.m;if(!d.items.length)return toast('Agrega líneas o sube una factura');const items=d.items.map(i=>({pid:+i.pid,qty:+i.qty,cost:+i.cost}));const total=sum(items,i=>i.qty*i.cost);
 const b={id:S.seq.buy++,date:TODAY,sup:+d.sup,br:d.br,type:d.type,paid:d.type==='Contado'?total:0,due:d.type==='Crédito'?d.due:'',inv:d.file,items,total,margin:d.margin,recv:false};S.buys.push(b);
 if(d.auto){applyReceipt(b);toast('Compra #'+b.id+' guardada y stock de '+brs(b.br)+' abastecido')}else toast('Compra #'+b.id+' guardada. Falta recibir la mercadería');closeM();render()},
recvBuy(d){const b=S.buys.find(x=>x.id==d.id);applyReceipt(b);render();toast('Mercadería recibida: stock de '+brs(b.br)+' actualizado')},
newExp(){S.m={kind:'exp',br:S.br==='all'?'s1':S.br,desc:'',cat:'Servicios',amt:0};modal(`<h2>Registrar gasto</h2><div class="frm"><label class="f">Sucursal<select data-c="xm" data-k="br">${BR.map(b=>`<option value="${b.id}"${b.id===S.m.br?' selected':''}>${b.name}</option>`).join('')}</select></label><label class="f">Descripción<input data-c="xm" data-k="desc"></label><label class="f">Categoría<select data-c="xm" data-k="cat">${['Servicios','Transporte','Alquiler','Insumos','Otros'].map(c=>`<option>${c}</option>`).join('')}</select></label><label class="f">Monto (Q)<input type="number" step="0.01" data-c="xm" data-k="amt"></label></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-a="mclose">Cancelar</button><button class="btn pri" data-a="saveExp">Guardar</button></div>`)},
saveExp(){const m=S.m;if(!m.desc||!(m.amt>0))return toast('Completa descripción y monto');S.exp.push({id:S.exp.length+1,date:TODAY,br:m.br,desc:m.desc,cat:m.cat,amt:+m.amt});closeM();render()},
cobrar(d){const s=S.sales.find(x=>x.id==d.id);s.paid=s.total;render();toast('Cobro registrado')},pagar(d){const b=S.buys.find(x=>x.id==d.id);b.paid=b.total;render();toast('Pago registrado')},
newEmp(){S.m={kind:'emp',isNew:true,e:{name:'',role:'Vendedor',br:S.br==='all'?'s1':S.br,salary:3500,hired:TODAY,status:'Activo'}};modal(empModal())},
editEmp(d){S.m={kind:'emp',e:{...S.emps.find(e=>e.id==d.id)}};modal(empModal())},
saveEmp(){const e=S.m.e;if(!e.name.trim())return toast('Escribe el nombre');if(S.m.isNew)S.emps.push({...e,id:S.seq.emp++,igss:'1000'+(3000+S.seq.emp*41),salary:+e.salary});else Object.assign(S.emps.find(x=>x.id===e.id),e,{salary:+e.salary});closeM();render();toast('Empleado guardado')},
freq(d){S.freq=d.v;render()},
payRun(d){const f=S.freq==='Quincenal'?.5:1,per=S.freq==='Quincenal'?'Noviembre 2026 · 1ra quincena':'Noviembre 2026';const es=S.emps.filter(e=>e.br===d.br&&e.status==='Activo');const t=num(sum(es,e=>pay(e,f).neto));
 S.runs.push({id:S.seq.run++,period:per,freq:S.freq||'Mensual',br:d.br,total:t,status:'Pagada',date:TODAY});S.exp.push({id:S.exp.length+1,date:TODAY,br:d.br,desc:'Nómina '+per+' · '+brs(d.br),cat:'Nómina',amt:t});render();toast('Nómina pagada: '+Q(t)+' · registrada en Finanzas')}};
const C={gbr(v){S.br=v;render()},vn(v){S.tab.vn=v;render()},vq(v){S.tab.vq=v;render()},iq(v){S.inv.q=v;render()},
sm_br(v){S.m.br=v;modal(saleModal())},sm_cl(v){S.m.cl=v},sm_type(v){S.m.type=v},sm_pid(v,d){S.m.items[d.i].pid=+v;modal(saleModal())},sm_qty(v,d){S.m.items[d.i].qty=Math.max(1,+v||1);modal(saleModal())},
pm(v,d){setPath(S.m.p,d.k,['name','cat','unit'].includes(d.k)?v:num(v))},trfrom(v){S.tr.from=v;S.tr.items=[];render()},trnote(v){S.tr.note=v},trqty(v,d){S.tr.items[d.i].qty=Math.max(1,+v||1);render()},
kbr(v){S.kd.br=v;render()},kpid(v){S.kd.pid=v;render()},
bm(v,d,el){const m=S.m;m[d.k]=el.type==='checkbox'?el.checked:v;if(d.k==='sup'||d.k==='br'){m.sup=+m.sup;if(d.k==='br')m.items.forEach(i=>i.cost=prod(i.pid).b[m.br].cost)}modal(buyModal())},
bi(v,d){const it=S.m.items[d.i];if(d.k==='pid'){it.pid=+v;it.cost=prod(v).b[S.m.br].cost}else it[d.k]=num(v);modal(buyModal())},
em(v,d){S.m.e[d.k]=v},pin(v,d){(S.payin[d.id]||(S.payin[d.id]={h:0,b:0,a:0}))[d.k]=num(v);render()},xm(v,d){S.m[d.k]=v}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.dataset.a==='mbg'&&e.target!==el)return;(A[el.dataset.a]||(()=>{}))(el.dataset,el,e)});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='invfile'&&t.files[0])return readInvoice(t.files[0]);const el=t.closest('[data-c]');if(el&&C[el.dataset.c])C[el.dataset.c](el.value,el.dataset,el)});
document.addEventListener('dragover',e=>{if(e.target.closest('#drop')){e.preventDefault()}});
document.addEventListener('drop',e=>{if(e.target.closest('#drop')){e.preventDefault();const f=e.dataTransfer.files[0];if(f)readInvoice(f)}});
function fromHash(){const h=location.hash.slice(1);if(VIEWS[h])S.route=h;render()}
addEventListener('hashchange',fromHash);fromHash();
</script>
